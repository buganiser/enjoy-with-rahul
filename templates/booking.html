{% extends "base.html" %}

{% block title %}Booking - Enjoy with R@hul{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom:30px;">Booking</h1>

<div class="booking-container">

    <!-- Dining Form -->
    <form action="/booking" method="post" class="booking-form">
        <h2>🍽 Lunch / Dinner Reservation</h2>
        <input type="hidden" name="booking_type" value="dining">

        <label for="name">Name:</label>
        <input type="text" name="name" required>

        <label for="email">Email:</label>
        <input type="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" required>

        <label for="date">Date:</label>
        <input type="date" name="date" required>

        <label for="guests">Number of Guests:</label>
        <input type="number" name="guests" min="1" required>

        <label for="food">Food Option:</label>
        <select name="food" required>
            <option value="veg">Veg</option>
            <option value="non-veg">Non Veg</option>
            <option value="both">Both</option>
        </select>

        <button type="submit">Reserve Now</button>
    </form>

    <!-- Stay Form -->
    <form action="/booking" method="post" class="booking-form">
        <h2>🏨 Stay / Room Booking</h2>
        <input type="hidden" name="booking_type" value="stay">

        <label for="name">Name:</label>
        <input type="text" name="name" required>

        <label for="email">Email:</label>
        <input type="email" name="email" required>

        <div class="date-row">
            <div>
                <label for="checkin">Check-in Date:</label>
                <input type="date" name="checkin" required>
            </div>
            <div>
                <label for="checkout">Check-out Date:</label>
                <input type="date" name="checkout" required>
            </div>
        </div>

        <label for="guests">Number of Guests:</label>
        <input type="number" name="guests" min="1" required>

        <label for="room">Room Type:</label>
        <select name="room" required>
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="double-extra">Double with Extra Bed</option>
            <option value="two-sharing">Two Sharing</option>
            <option value="three-sharing">Three Sharing</option>
        </select>

        <label for="food">Food Option:</label>
        <select name="food" required>
            <option value="veg">Veg</option>
            <option value="non-veg">Non Veg</option>
            <option value="both">Both</option>
        </select>

        <button type="submit">Book Now</button>
    </form>
</div>
{% endblock %}
