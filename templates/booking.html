{% extends "base.html" %}

{% block title %}Booking - Enjoy with R@hul{% endblock %}

{% block content %}
<h1>Booking</h1>
<p>Fill the form below to book your stay with us:</p>

<form action="/booking" method="post" class="booking-form">
    
    <!-- Name -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>

    <!-- Email -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <!-- Date Range -->
    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin" required><br><br>

    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout" required><br><br>

    <!-- Guests -->
    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" name="guests" min="1" required><br><br>

    <!-- Room Type -->
    <label for="room">Room Type:</label>
    <select id="room" name="room" required>
        <option value="single">Single</option>
        <option value="double">Double</option>
        <option value="double-extra">Double with Extra Bed</option>
        <option value="single-extra">Single with Extra Bed</option>
        <option value="two-sharing">Two sharing</option>
        <option value="three-sharing">Three sharing</option>
    </select><br><br>

    <!-- Submit -->
    <button type="submit">Book Now</button>
</form>
{% endblock %}
